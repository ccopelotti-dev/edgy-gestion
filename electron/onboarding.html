<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Edgy Gestión</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; background:#f8f8f8; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  .card { background:white; border-radius:12px; padding:32px 36px; box-shadow:0 4px 24px rgba(0,0,0,.08); width:380px; }
  h1 { font-size:18px; margin:0 0 6px; color:#111; }
  p { font-size:13px; color:#666; margin:0 0 20px; line-height:1.5; }
  label { font-size:12px; color:#444; display:block; margin-bottom:6px; }
  .row { display:flex; align-items:stretch; border:1px solid #ddd; border-radius:8px; overflow:hidden; }
  .row:focus-within { border-color:#111; }
  input { flex:1; border:none; padding:10px 12px; font-size:14px; outline:none; min-width:0; }
  .suffix { background:#f3f3f3; color:#888; font-size:12px; padding:10px 10px; white-space:nowrap; display:flex; align-items:center; }
  button { margin-top:16px; width:100%; padding:10px; border:none; border-radius:8px; background:#111; color:white; font-size:14px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .error { color:#c0392b; font-size:12px; margin-top:8px; display:none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Edgy Gestión</h1>
    <p>Primera vez que abrís la app en esta PC. ¿Cuál es el subdominio de tu negocio? Es la parte de la dirección antes de ".edgysistemas.tech" (te la dieron al dar de alta la cuenta).</p>
    <label for="slug">Subdominio</label>
    <div class="row">
      <input id="slug" placeholder="la-charcuteria-express" autofocus />
      <span class="suffix">.edgysistemas.tech</span>
    </div>
    <div class="error" id="error">Escribí el subdominio antes de continuar.</div>
    <button id="continuar">Continuar</button>
  </div>
  <script>
    const input = document.getElementById('slug');
    const btn = document.getElementById('continuar');
    const err = document.getElementById('error');
    btn.addEventListener('click', async () => {
      const slug = input.value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
      if (!slug) { err.style.display = 'block'; return; }
      err.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Entrando...';
      await window.electronAPI.guardarNegocio(slug);
    });
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') btn.click(); });
  </script>
</body>
</html>
